name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore Gil.slnx
      - run: dotnet build Gil.slnx --no-restore --configuration Release
      # Compatibility replays and live calls skip themselves: their fixtures and endpoints are not part of this repository.
      - run: dotnet test --solution Gil.slnx --no-build --configuration Release
